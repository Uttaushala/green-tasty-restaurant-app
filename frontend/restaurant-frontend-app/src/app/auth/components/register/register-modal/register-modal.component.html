<div class="overlay" role="button" tabindex="0" (click)="close()" (keydown.enter)="close()" (keydown.space)="close()">
  <div class="modal" tabindex="0" role="dialog" aria-modal="true" aria-label="Create an Account" (click)="$event.stopPropagation()" (keydown)="$event.stopPropagation()">
    <button type="button" class="icon-button icon-button--small modal-close" (click)="close()" aria-label="Close">
      <img src="assets/svg/close.svg" alt="" />
    </button>

    <app-register-form (registered)="registered.emit()" />
  </div>
</div>
