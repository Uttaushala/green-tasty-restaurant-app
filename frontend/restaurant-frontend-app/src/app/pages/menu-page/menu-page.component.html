<div class="menu-container">
  @if (isPreOrderEnabled) {
    <div class="pre-order-notice" role="status">
      You are making a pre-order for the reservation <strong>{{ preOrderReservationLabel }}</strong>
    </div>
  }

  <div class="page-navigation">
    <a routerLink="/main">Main page</a>
    <svg class="page-navigation__chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6" /></svg>
    <span class="page-navigation__location">Menu</span>
  </div>

  <section class="hero-section">
    <app-main-cover-image
      src="assets/img/main-page-cover.jpg"
      alt="Delicious Georgian food"
    />
    <div class="hero-overlay"></div>

    <div class="hero-text-block">
      <p class="hero-subtitle">Green & Tasty Restaurants</p>
      <h1 class="hero-title">Menu</h1>
    </div>
  </section>

  <section class="content-sections">
    <div class="menu-section">
      <div class="filter-sort-bar">
        <div class="category-buttons">
          @for (category of menuCategories; track category) {
            <button
              type="button"
              (click)="onCategorySelected(category)"
              [class.active]="selectedCategory === category"
            >
              {{ menuCategoryLabels[category] }}
            </button>
          }
        </div>

        <div class="sort-dropdown">
          <label for="sortSelect">Sort by:</label>
          <select id="sortSelect" (change)="onSortChanged($event)">
            @for (sort of sortOptions; track sort) {
              <option [value]="sort" [selected]="sort === selectedSort">
                {{ sortLabels[sort] }}
              </option>
            }
          </select>
        </div>
      </div>

      <div class="dish-cards">
        @for (dish of filteredDishes; track dish) {
          <app-dish-card
            [dish]="dish"
            [preOrderEnabled]="isPreOrderEnabled"
            (dishClicked)="openModal(dish)"
            (preOrderClicked)="addDishToCart(dish)"
          ></app-dish-card>
        }
      </div>
    </div>
  </section>

  @if (selectedDish) {
    <app-dish-modal
      [dish]="selectedDish"
      [preOrderEnabled]="isPreOrderEnabled"
      (preOrder)="addDishFromModal(selectedDish)"
      (closed)="closeModal()"
    ></app-dish-modal>
  }
</div>
